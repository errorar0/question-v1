/* Continuous, touch-friendly sliders with a soft blue progress fill. */
.range-wrap{margin:0 2px}
input[type=range]{height:44px;touch-action:pan-y;--progress:50%;outline-offset:5px}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:linear-gradient(to right,#a7d8ff 0%,#a7d8ff var(--progress),#324454 var(--progress),#324454 100%);box-shadow:0 0 12px #75baff18}
input[type=range]::-moz-range-track{height:5px;border-radius:999px;background:linear-gradient(to right,#a7d8ff 0%,#a7d8ff var(--progress),#324454 var(--progress),#324454 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:23px;height:23px;border:2px solid #d6ecff;border-radius:50%;background:#9bcfff;margin-top:-9px;box-shadow:0 0 0 5px #83bfff16,0 0 16px #86c8ff5c;transition:box-shadow .18s ease,transform .18s ease}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:2px solid #d6ecff;background:#9bcfff;border-radius:50%;box-shadow:0 0 0 5px #83bfff16,0 0 16px #86c8ff5c}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12);box-shadow:0 0 0 8px #83bfff26,0 0 22px #86c8ff8a}
input[type=range]:disabled{opacity:.35;cursor:not-allowed}
/* Untouched sliders are muted blue-grey, but remain fully interactive. */
input[type=range]:not(.touched)::-webkit-slider-runnable-track{background:linear-gradient(to right,#778b9d 0%,#778b9d var(--progress),#35414d var(--progress),#35414d 100%);box-shadow:none}
input[type=range]:not(.touched)::-moz-range-track{background:linear-gradient(to right,#778b9d 0%,#778b9d var(--progress),#35414d var(--progress),#35414d 100%)}
input[type=range]:not(.touched)::-webkit-slider-thumb{background:#879aaa;border-color:#a6b4c0;box-shadow:none}
input[type=range]:not(.touched)::-moz-range-thumb{background:#879aaa;border-color:#a6b4c0;box-shadow:none}
